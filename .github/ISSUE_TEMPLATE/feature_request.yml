name: Feature request
description: Propose a focused capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or opportunity should this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the desired behavior and relevant constraints.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should the improvement be evaluated?

