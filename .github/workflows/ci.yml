name: CI

on:
  push:
    branches:
      - main
      - cognitive-runtime-v1
      - development-clean
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Compile core Python modules
        run: |
          python -m compileall -q \
            agents cognitive_graph constraints core cultural demography \
            ecologies economy education environment health language law media \
            memory narrative ontology runtime tests visualization

      - name: Run tests
        run: python -m pytest
